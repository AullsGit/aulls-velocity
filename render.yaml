# Blueprint do Render.com. Ver docs/DEPLOY.md para o passo a passo completo.
#
# Duas formas de correr:
#  1. Sem RunPod (como hoje): dockerfilePath ./Dockerfile e COMPUTE_PROVIDER=local — o vídeo é
#     gerado na CPU do Render (lento no plano grátis).
#  2. Com RunPod (recomendado): dockerfilePath ./Dockerfile.api e COMPUTE_PROVIDER=runpod — o
#     Render só orquestra; o vídeo é gerado na GPU do RunPod.
services:
  - type: web
    name: aulls-velocity-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Assina tokens internos (links de ficheiros, webhooks). Gerado pelo Render, nunca no código.
      - key: APP_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: "https://aulls-velocity-studio.onrender.com"
      # --- Supabase (contas, dados, ficheiros) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: VELOCITY_OWNER_EMAIL
        sync: false
      # --- Processamento de vídeo: local (CPU do Render) ou runpod (GPU sob demanda) ---
      - key: COMPUTE_PROVIDER
        value: "local"
      - key: RUNPOD_API_KEY
        sync: false
      - key: RUNPOD_ENDPOINT_ID
        sync: false
      - key: VELOCITY_NO_TEXT
        value: "1"
      # --- Agente de edição (sem a chave fica desligado e o resto funciona) ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AGENT_MODEL
        value: "claude-opus-5-5"
      # --- Pagamentos (PayPal) ---
      - key: PAYPAL_ENV
        value: "sandbox"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # --- Login Google (só depois de o ativar no Supabase; ver docs) ---
      - key: GOOGLE_AUTH_ENABLED
        value: "0"
      # --- Limites (50 MB = máximo por ficheiro no Supabase Free) ---
      - key: VELOCITY_MAX_UPLOAD_MB
        value: "50"
      - key: VELOCITY_MAX_CLIPS
        value: "20"
      - key: VELOCITY_MAX_QUEUE
        value: "5"
      - key: VELOCITY_RATE_LIMIT_JOBS
        value: "10"
