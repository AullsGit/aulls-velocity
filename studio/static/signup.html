<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta — Aulls Velocity</title>
<link rel="stylesheet" href="/static/brand.css">
</head>
<body>
<div class="auth-wrap">
  <div class="brand"><span class="bolt">⚡</span> Aulls Velocity</div>
  <div class="card" style="margin-top:22px">
    <h1 style="font-size:1.5rem">Criar conta</h1>
    <p class="hint">Grátis, leva 1 minuto. A tua 1ª edição não custa nada.</p>
    <form id="form">
      <label class="field">Email</label>
      <input type="email" id="email" required autocomplete="email">
      <label class="field">Password</label>
      <input type="password" id="password" required minlength="6" autocomplete="new-password">
      <button class="primary" type="submit" id="btn">Criar conta</button>
      <div class="err-box" id="err"></div>
    </form>
    <div class="foot-link">Já tens conta? <a href="/login">Entrar</a></div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
$("#form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#btn").disabled = true; $("#err").textContent = "";
  try {
    const r = await fetch("/api/auth/signup", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({email: $("#email").value.trim(), password: $("#password").value}),
    });
    const j = await r.json();
    if (!r.ok) { $("#err").textContent = j.error || "não foi possível criar a conta"; $("#btn").disabled = false; return; }
    if (j.confirm_email) {
      $("#err").style.color = "var(--ok)";
      $("#err").textContent = "Conta criada — confirma o teu email antes de entrares.";
      return;
    }
    window.location.href = "/";
  } catch (e) { $("#err").textContent = "erro de rede — tenta novamente"; $("#btn").disabled = false; }
});
</script>
</body>
</html>
